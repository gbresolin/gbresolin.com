name: Déploiement

# Le déploiement part de `main`. `workflow_dispatch` permet de relancer une
# mise en ligne à l'identique depuis l'interface GitHub, sans commit vide.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cible:
        description: 'Où déployer'
        required: true
        default: preproduction
        type: choice
        options:
          - preproduction
          - production

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Un push sur main déploie en préproduction par défaut. La production
      # exige un déclenchement manuel, ce qui laisse le temps de relire.
      - name: Déterminer la cible
        id: cible
        run: |
          CIBLE="${{ github.event.inputs.cible || 'preproduction' }}"
          echo "nom=$CIBLE" >> "$GITHUB_OUTPUT"
          if [ "$CIBLE" = "production" ]; then
            echo "chemin=${{ secrets.CHEMIN_PRODUCTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "chemin=${{ secrets.CHEMIN_PREPRODUCTION }}" >> "$GITHUB_OUTPUT"
          fi

      # Garde-fou : la production ne peut pas partir avec des placeholders.
      # La préproduction, elle, est justement faite pour les relire en ligne.
      - name: Vérifier que le contenu est complet
        if: steps.cible.outputs.nom == 'production'
        run: npm run check:contenu

      - name: Construire le site
        run: npm run build

      # La préproduction ne doit jamais être indexée : elle est servie sur une
      # URL publique, et un doublon indexé nuirait au référencement du site.
      - name: Interdire l'indexation de la préproduction
        if: steps.cible.outputs.nom == 'preproduction'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          find dist -name '*.html' -exec \
            sed -i 's|</head>|<meta name="robots" content="noindex, nofollow"></head>|' {} +

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # On épingle l'empreinte du serveur plutôt que de l'accepter
          # aveuglément : sans ça, le déploiement fait confiance à n'importe
          # quel hôte qui répondrait à cette adresse.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # --delete garde la cible propre, mais effacerait aussi ce qu'Apache et
      # cPanel y déposent eux-mêmes. Les exclusions ci-dessous les protègent :
      # sans elles, le premier déploiement casserait le renouvellement du
      # certificat Let's Encrypt.
      - name: Déployer via rsync
        run: |
          rsync -rlvz --delete --checksum \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude '.htpasswd' \
            --exclude '.user.ini' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.cible.outputs.chemin }}/"

      - name: Récapitulatif
        run: |
          echo "### Déploiement ${{ steps.cible.outputs.nom }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cible : \`${{ steps.cible.outputs.chemin }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
